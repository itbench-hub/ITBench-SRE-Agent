---
- name: (Hack) Kubeconfig path inside AWX-EE container
  ansible.builtin.shell: "find /runner/env -type f -size +3072c -exec grep -l 'kind: Config' {} \\;"
  register: kubeconfig_path_inside_ee

- name: Get the Ingress URL
  ansible.builtin.shell: "KUBECONFIG={{ kubeconfig_path_inside_ee.stdout }} kubectl get ingress prometheus -n prometheus -o json"
  register: observability_stack_ingress
  retries: 5
  delay: 60
  until: (observability_stack_ingress.stdout | length) > 0
  ignore_errors: yes

- name: Extract the Ingress hostname information
  set_fact:
    ingress_hostname: "{{ observability_stack_ingress.stdout | from_json | json_query('status.loadBalancer.ingress[0].hostname') }}"
  when: observability_stack_ingress.stdout | trim != ''

- name: Set the Prometheus URL
  set_fact:
    prometheus_url: "http://{{ ingress_hostname }}"
    observability_stack_url: "http://{{ ingress_hostname }}"
  when: ingress_hostname is defined and ingress_hostname | trim != ''

- name: Set the Jaeger URL
  set_fact:
    jaeger_url: "http://{{ ingress_hostname }}"
  when: ingress_hostname is defined and ingress_hostname | trim != ''

- name: Set the Topology Monitor URL
  set_fact:
    topology_url: "http://{{ ingress_hostname }}/topology"
  when: ingress_hostname is defined and ingress_hostname | trim != ''
